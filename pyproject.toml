[project]
name = "gemini-openai-proxy"
version = "0.1.0"
description = "OpenAI-compatible reverse proxy for Google Gemini Web (chat, vision, image generation, SSE streaming)"
requires-python = ">=3.11"
dependencies = [
    "gemini-webapi>=2.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
browser = ["browser-cookie3"]

[dependency-groups]
dev = ["pytest>=8.2"]

[project.scripts]
gemini-openai-proxy = "gemini_openai_proxy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_openai_proxy"]
